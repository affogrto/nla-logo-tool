<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NLA Logo Tool">
  <meta name="theme-color" content="#0d0d10">
  <title>Noir Lace Atelier Logo Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0e;
      --panel: #15151a;
      --panel-2: #1d1d23;
      --text: #f7f3eb;
      --muted: #aaa39a;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #f6eee0;
      --accent-ink: #111114;
      --danger: #d7a2a2;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 28rem),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0 18px;
    }

    .brand {
      display: grid;
      gap: 3px;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 4vw, 44px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status {
      min-width: 160px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .workspace,
    .controls {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(21, 21, 26, 0.84);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }

    .workspace {
      min-height: 68vh;
      padding: 14px;
    }

    .dropzone {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 68vh;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.025) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.025) 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
      overflow: hidden;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .dropzone.is-active {
      border-color: rgba(246, 238, 224, 0.75);
      background-color: rgba(246, 238, 224, 0.06);
    }

    .empty {
      display: grid;
      justify-items: center;
      gap: 14px;
      width: min(420px, 88%);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }

    .empty-mark svg {
      width: 34px;
      height: 34px;
    }

    .empty h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .canvas-wrap {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 68vh;
      width: 100%;
      overflow: auto;
      touch-action: pan-x pan-y;
    }

    .canvas-wrap.is-visible {
      display: flex;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: min(78vh, 900px);
      border-radius: 4px;
      background: #07070a;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    }

    .controls {
      display: grid;
      gap: 14px;
      padding: 14px;
      position: sticky;
      top: 12px;
    }

    .section {
      display: grid;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.03);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 22px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .row {
      display: grid;
      gap: 7px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .label output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 13px;
      border-radius: var(--radius);
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
    }

    .button.full {
      width: 100%;
    }

    .button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .mini {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .error {
      display: none;
      padding: 10px 12px;
      border: 1px solid rgba(215, 162, 162, 0.34);
      border-radius: var(--radius);
      color: var(--danger);
      background: rgba(215, 162, 162, 0.08);
      font-size: 13px;
      line-height: 1.5;
    }

    .error.is-visible {
      display: block;
    }

    .switch {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 34px;
      color: var(--muted);
      font-size: 13px;
    }

    .switch input {
      width: 44px;
      height: 24px;
      margin: 0;
      accent-color: var(--accent);
    }

    .preview-logo {
      display: grid;
      place-items: center;
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, #29292e 25%, transparent 25%),
        linear-gradient(-45deg, #29292e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #29292e 75%),
        linear-gradient(-45deg, transparent 75%, #29292e 75%),
        #1b1b20;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      overflow: hidden;
    }

    .preview-logo canvas {
      max-width: 76%;
      max-height: 92px;
      box-shadow: none;
      background: transparent;
    }

    @media (hover: hover) {
      .button:hover {
        border-color: rgba(246, 238, 224, 0.42);
        background: #25252c;
      }

      .button.primary:hover {
        background: #fff8ea;
      }
    }

    @media (max-width: 860px) {
      .topbar {
        display: grid;
      }

      .status {
        width: 100%;
        text-align: left;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
      }

      .workspace,
      .dropzone,
      .canvas-wrap {
        min-height: 48vh;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding-inline: 12px;
      }

      .workspace,
      .controls {
        border-radius: 0;
        margin-inline: -12px;
        border-inline: 0;
      }

      .workspace {
        padding: 10px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Noir Lace Atelier</h1>
        <p>NLAロゴを右下へ静かに合成する単体HTMLツール</p>
      </div>
      <div class="status" id="status">画像を選んでください</div>
    </header>

    <div class="grid">
      <section class="workspace" aria-label="画像プレビュー">
        <div class="dropzone" id="dropzone">
          <input class="file-input" id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,image/*">
          <div class="empty" id="emptyState">
            <div class="empty-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
              </svg>
            </div>
            <h2>作品画像を選択</h2>
            <p>Macはドラッグ＆ドロップ、iPhoneはボタンから写真を選べます。処理はこの端末内だけで完結します。</p>
            <button class="button primary" id="pickButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 17.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5Z" stroke="currentColor" stroke-width="1.7"/>
                <path d="m7 15 3-3 2.3 2.3L15.5 11 19 14.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 8.5h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              </svg>
              画像を選ぶ
            </button>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="mainCanvas"></canvas>
          </div>
        </div>
      </section>

      <aside class="controls" aria-label="合成設定">
        <div class="section">
          <div class="section-title">出力</div>
          <button class="button primary full" id="downloadButton" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 18.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            PNGで保存
          </button>
          <button class="button full" id="shareButton" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8.5 12.5 15.5 8M8.5 11.5l7 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M6.5 15.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM17.5 9.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM17.5 20.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            共有
          </button>
          <button class="button full" id="resetButton" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 8.5A8 8 0 1 1 4.2 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M5 4v4.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            初期設定に戻す
          </button>
          <p class="mini">iPhoneで保存が出ない場合は「共有」から写真またはファイルに保存してください。</p>
        </div>

        <div class="section">
          <div class="section-title">ロゴ <span>右下固定</span></div>
          <div class="preview-logo">
            <canvas id="logoPreview" width="280" height="140"></canvas>
          </div>

          <div class="row">
            <label class="label" for="sizeRange">サイズ <output id="sizeValue">7%</output></label>
            <input id="sizeRange" type="range" min="3" max="12" value="7" step="0.5">
          </div>

          <div class="row">
            <label class="label" for="opacityRange">不透明度 <output id="opacityValue">42%</output></label>
            <input id="opacityRange" type="range" min="10" max="80" value="42" step="1">
          </div>

          <div class="row">
            <label class="label" for="marginRange">余白 <output id="marginValue">2%</output></label>
            <input id="marginRange" type="range" min="0.5" max="5" value="2" step="0.1">
          </div>
        </div>

        <div class="section">
          <div class="section-title">背景除去 <span>黒を透明化</span></div>
          <div class="row">
            <label class="label" for="thresholdRange">黒背景のしきい値 <output id="thresholdValue">54</output></label>
            <input id="thresholdRange" type="range" min="10" max="120" value="54" step="1">
          </div>

          <div class="row">
            <label class="label" for="softnessRange">境界のやわらかさ <output id="softnessValue">42</output></label>
            <input id="softnessRange" type="range" min="5" max="90" value="42" step="1">
          </div>

          <label class="switch" for="shadowToggle">
            <span>白背景向けに薄い影を入れる</span>
            <input id="shadowToggle" type="checkbox">
          </label>
        </div>

        <div class="error" id="errorBox" role="alert"></div>
      </aside>
    </div>
  </main>

    const logoPreviewCtx = els.logoPreview.getContext("2d", { alpha: true });

    function setStatus(message) {
      els.status.textContent = message;
    }

    function showError(message) {
      els.errorBox.textContent = message;
      els.errorBox.classList.add("is-visible");
    }

    function clearError() {
      els.errorBox.textContent = "";
      els.errorBox.classList.remove("is-visible");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        image.src = src;
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("ファイルを読み込めませんでした。"));
        reader.readAsDataURL(file);
      });
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("PNGを書き出せませんでした。"));
          }
        }, "image/png");
      });
    }

    function values() {
      return {
        sizePercent: Number(els.sizeRange.value),
        opacity: Number(els.opacityRange.value) / 100,
        marginPercent: Number(els.marginRange.value),
        threshold: Number(els.thresholdRange.value),
        softness: Number(els.softnessRange.value),
        shadow: els.shadowToggle.checked,
      };
    }

    function updateValueLabels() {
      const current = values();
      els.sizeValue.textContent = `${current.sizePercent}%`;
      els.opacityValue.textContent = `${Math.round(current.opacity * 100)}%`;
      els.marginValue.textContent = `${current.marginPercent}%`;
      els.thresholdValue.textContent = `${current.threshold}`;
      els.softnessValue.textContent = `${current.softness}`;
    }

    function makeTransparentLogo() {
      if (!state.logoImage) return null;

      const current = values();
      const source = document.createElement("canvas");
      source.width = state.logoImage.naturalWidth || state.logoImage.width;
      source.height = state.logoImage.naturalHeight || state.logoImage.height;
      const sourceCtx = source.getContext("2d", { willReadFrequently: true });
      sourceCtx.drawImage(state.logoImage, 0, 0);

      const imageData = sourceCtx.getImageData(0, 0, source.width, source.height);
      const data = imageData.data;
      const low = current.threshold;
      const high = current.threshold + current.softness;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const whiteness = Math.max(r, g, b);
        const alphaFactor = clamp((luma - low) / Math.max(1, high - low), 0, 1);
        const cleanWhite = clamp((whiteness - low) / Math.max(1, 255 - low), 0, 1);
        const alpha = Math.round(255 * alphaFactor * cleanWhite);
        data[i] = 255;
        data[i + 1] = 252;
        data[i + 2] = 245;
        data[i + 3] = alpha;
      }

      sourceCtx.putImageData(imageData, 0, 0);
      state.logoCanvas = source;
      state.trimmedLogoCanvas = trimTransparentCanvas(source);
      return state.trimmedLogoCanvas;
    }

    function trimTransparentCanvas(source) {
      const sourceCtx = source.getContext("2d", { willReadFrequently: true });
      const imageData = sourceCtx.getImageData(0, 0, source.width, source.height);
      const data = imageData.data;
      let minX = source.width;
      let minY = source.height;
      let maxX = -1;
      let maxY = -1;

      for (let y = 0; y < source.height; y += 1) {
        for (let x = 0; x < source.width; x += 1) {
          const alpha = data[(y * source.width + x) * 4 + 3];
          if (alpha > 8) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      if (maxX < minX || maxY < minY) {
        return source;
      }

      const pad = 8;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(source.width - 1, maxX + pad);
      maxY = Math.min(source.height - 1, maxY + pad);

      const width = maxX - minX + 1;
      const height = maxY - minY + 1;
      const trimmed = document.createElement("canvas");
      trimmed.width = width;
      trimmed.height = height;
      trimmed.getContext("2d").drawImage(source, minX, minY, width, height, 0, 0, width, height);
      return trimmed;
    }

    function tintCanvas(source, color) {
      const tinted = document.createElement("canvas");
      tinted.width = source.width;
      tinted.height = source.height;
      const tintedCtx = tinted.getContext("2d");
      tintedCtx.drawImage(source, 0, 0);
      tintedCtx.globalCompositeOperation = "source-in";
      tintedCtx.fillStyle = color;
      tintedCtx.fillRect(0, 0, tinted.width, tinted.height);
      tintedCtx.globalCompositeOperation = "source-over";
      return tinted;
    }

    function drawLogoPreview() {
      const logo = state.trimmedLogoCanvas || makeTransparentLogo();
      logoPreviewCtx.clearRect(0, 0, els.logoPreview.width, els.logoPreview.height);
      if (!logo) return;

      const maxWidth = els.logoPreview.width * 0.72;
      const maxHeight = els.logoPreview.height * 0.8;
      const scale = Math.min(maxWidth / logo.width, maxHeight / logo.height);
      const width = logo.width * scale;
      const height = logo.height * scale;
      const x = (els.logoPreview.width - width) / 2;
      const y = (els.logoPreview.height - height) / 2;
      logoPreviewCtx.globalAlpha = values().opacity;
      logoPreviewCtx.drawImage(logo, x, y, width, height);
      logoPreviewCtx.globalAlpha = 1;
    }

    async function render() {
      clearError();
      updateValueLabels();
      if (!state.sourceImage) {
        makeTransparentLogo();
        drawLogoPreview();
        return;
      }

      const logo = makeTransparentLogo();
      drawLogoPreview();

      const width = state.sourceImage.naturalWidth || state.sourceImage.width;
      const height = state.sourceImage.naturalHeight || state.sourceImage.height;
      els.canvas.width = width;
      els.canvas.height = height;

      ctx.clearRect(0, 0, width, height);
      ctx.globalAlpha = 1;
      ctx.drawImage(state.sourceImage, 0, 0, width, height);

      const current = values();
      const margin = Math.round(width * (current.marginPercent / 100));
      const logoWidth = Math.round(width * (current.sizePercent / 100));
      const logoHeight = Math.round(logoWidth * (logo.height / logo.width));
      const x = Math.max(0, width - logoWidth - margin);
      const y = Math.max(0, height - logoHeight - margin);

      if (current.shadow) {
        const shadowLogo = tintCanvas(logo, "rgba(20, 20, 22, 1)");
        ctx.save();
        ctx.globalAlpha = Math.min(0.24, current.opacity * 0.5);
        ctx.filter = `blur(${Math.max(2, Math.round(width * 0.002))}px)`;
        ctx.drawImage(shadowLogo, x + Math.max(1, Math.round(width * 0.0016)), y + Math.max(1, Math.round(width * 0.0016)), logoWidth, logoHeight);
        ctx.restore();
      }

      ctx.globalAlpha = current.opacity;
      ctx.drawImage(logo, x, y, logoWidth, logoHeight);
      ctx.globalAlpha = 1;

      try {
        state.lastBlob = await canvasToBlob(els.canvas);
        els.downloadButton.disabled = false;
        els.shareButton.disabled = !canShareFiles();
      } catch (error) {
        showError(error.message);
      }
    }

    function canShareFiles() {
      if (!navigator.canShare || !navigator.share || !state.lastBlob) return false;
      const file = new File([state.lastBlob], buildOutputName(), { type: "image/png" });
      return navigator.canShare({ files: [file] });
    }

    function buildOutputName() {
      const safeBase = state.sourceFileName
        .replace(/\.[^.]+$/, "")
        .replace(/[\\/:*?"<>|]+/g, "-")
        .slice(0, 90) || "nla-logo-output";
      return `${safeBase}_nla.png`;
    }

    async function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        showError("画像ファイルを選んでください。");
        return;
      }

      clearError();
      setStatus("読み込み中...");
      try {
        const dataUrl = await readFileAsDataURL(file);
        state.sourceImage = await loadImage(dataUrl);
        state.sourceFileName = file.name || "nla-logo-output";
        els.emptyState.style.display = "none";
        els.canvasWrap.classList.add("is-visible");
        await render();
        setStatus(`${state.sourceImage.naturalWidth || state.sourceImage.width}×${state.sourceImage.naturalHeight || state.sourceImage.height} / PNG出力`);
      } catch (error) {
        showError(error.message);
        setStatus("読み込みに失敗しました");
      }
    }

    async function downloadOutput() {
      if (!state.lastBlob) return;
      const name = buildOutputName();
      if (state.lastObjectUrl) URL.revokeObjectURL(state.lastObjectUrl);
      state.lastObjectUrl = URL.createObjectURL(state.lastBlob);

      const link = document.createElement("a");
      link.href = state.lastObjectUrl;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setStatus(`${name} を保存しました`);
    }

    async function shareOutput() {
      if (!state.lastBlob) return;
      const file = new File([state.lastBlob], buildOutputName(), { type: "image/png" });
      try {
        await navigator.share({
          files: [file],
          title: "Noir Lace Atelier Logo Image",
        });
      } catch (error) {
        if (error.name !== "AbortError") {
          showError("共有できませんでした。PNGで保存を試してください。");
        }
      }
    }

    function resetControls() {
      els.sizeRange.value = "7";
      els.opacityRange.value = "42";
      els.marginRange.value = "2";
      els.thresholdRange.value = "54";
      els.softnessRange.value = "42";
      els.shadowToggle.checked = false;
      render();
    }

    function bindEvents() {
      els.pickButton.addEventListener("click", () => els.fileInput.click());
      els.fileInput.addEventListener("change", () => handleFile(els.fileInput.files[0]));
      els.downloadButton.addEventListener("click", downloadOutput);
      els.shareButton.addEventListener("click", shareOutput);
      els.resetButton.addEventListener("click", resetControls);

      [els.sizeRange, els.opacityRange, els.marginRange, els.thresholdRange, els.softnessRange, els.shadowToggle].forEach((control) => {
        control.addEventListener("input", render);
        control.addEventListener("change", render);
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        els.dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          els.dropzone.classList.add("is-active");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        els.dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          els.dropzone.classList.remove("is-active");
        });
      });

      els.dropzone.addEventListener("drop", (event) => {
        const file = event.dataTransfer.files && event.dataTransfer.files[0];
        handleFile(file);
      });

      window.addEventListener("paste", (event) => {
        const items = Array.from(event.clipboardData?.items || []);
        const imageItem = items.find((item) => item.type.startsWith("image/"));
        if (imageItem) {
          handleFile(imageItem.getAsFile());
        }
      });
    }

    async function init() {
      bindEvents();
      try {
        state.logoImage = await loadImage(LOGO_DATA_URL);
        makeTransparentLogo();
        drawLogoPreview();
        setStatus("画像を選んでください");
      } catch (error) {
        showError("内蔵ロゴを読み込めませんでした。");
        setStatus("ロゴ読み込み失敗");
      }
    }

    init();
  </script>
</body>
</html>
